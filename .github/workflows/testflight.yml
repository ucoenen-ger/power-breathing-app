name: Deploy to TestFlight

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for TestFlight'
        required: false
        default: 'Neue Version'

jobs:
  deploy:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Capacitor sync
        run: npx cap sync ios

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.SIGNING_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "ci" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "ci" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "ci" build.keychain
          rm /tmp/cert.p12

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          python3 - <<'PYEOF'
import base64, os, sys, subprocess, re
profile_b64 = os.environ.get('PROFILE_BASE64', '').strip()
print('Secret length:', len(profile_b64), 'chars')
try:
    profile_data = base64.b64decode(profile_b64)
except Exception as e:
    print('base64 decode error:', e)
    sys.exit(1)
print('Decoded size:', len(profile_data), 'bytes')
profile_dir = os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles')
os.makedirs(profile_dir, exist_ok=True)
profile_path = os.path.join(profile_dir, 'dist.mobileprovision')
with open(profile_path, 'wb') as f:
    f.write(profile_data)
print('UUID in binary:', b'UUID' in profile_data)
result = subprocess.run(['security', 'cms', '-D', '-i', profile_path], capture_output=True)
m = re.search(rb'<key>UUID</key>\s*<string>(.*?)</string>', result.stdout, re.DOTALL)
print('UUID from security cms:', m.group(1).decode() if m else 'NOT FOUND')
PYEOF

      - name: Build & upload to TestFlight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: bundle exec fastlane beta

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain || true
